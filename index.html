<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call-Out Request</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #C9F9FF 0%, #90D7FF 50%, #BFD0E0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 44px 48px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 40px rgba(144, 215, 255, 0.35), 0 2px 8px rgba(184, 179, 190, 0.18);
            border: 1.5px solid rgba(93, 253, 203, 0.3);
        }

        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
        }

        .logo-wrapper img {
            height: 56px;
            object-fit: contain;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2a3a4a;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            text-align: center;
            color: #7a8a9a;
            font-size: 0.92rem;
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #4a5a6a;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #BFD0E0;
            border-radius: 10px;
            font-size: 0.97rem;
            color: #2a3a4a;
            background: #f7fdff;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus {
            border-color: #5DFDCB;
            box-shadow: 0 0 0 3px rgba(93, 253, 203, 0.2);
            background: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            background: linear-gradient(90deg, #5DFDCB, #90D7FF);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            color: #1a2e3a;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(93, 253, 203, 0.35);
        }

        button[type="submit"]:hover {
            opacity: 0.92;
            box-shadow: 0 6px 22px rgba(93, 253, 203, 0.45);
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #successMsg {
            margin-top: 18px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            min-height: 24px;
            border-radius: 8px;
            padding: 0;
            transition: all 0.3s;
        }

        #successMsg.success {
            color: #0a7a5a;
            background: rgba(93, 253, 203, 0.18);
            padding: 10px;
        }

        #successMsg.error {
            color: #b00020;
            background: rgba(176, 0, 32, 0.07);
            padding: 10px;
        }

        .divider {
            border: none;
            border-top: 1.5px solid #e0eaf2;
            margin: 24px 0 28px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrapper">
            <img src="CapitalnfusionLogo.png" alt="Capital Infusion Logo">
        </div>

        <hr class="divider">

        <h1>Call-Out Request</h1>
        <p class="subtitle">Fill out the form below to submit your absence.</p>

        <form id="calloutForm">
            <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Your Name" required>
            </div>

            <div class="date-row">
                <div class="field">
                    <label for="startDate">From</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="field">
                    <label for="endDate">To</label>
                    <input type="date" id="endDate" required>
                </div>
            </div>

            <div class="field">
                <label for="reason">Reason</label>
                <textarea id="reason" placeholder="Please describe your reason for calling out..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">Submit Request</button>
        </form>

        <div id="successMsg"></div>
    </div>

    <script>
        const today = new Date().toISOString().split("T")[0]; // Gets today's Date
        document.getElementById("startDate").min = today;
        document.getElementById("endDate").min = today;

        document.getElementById("startDate").addEventListener("change", function () {
            document.getElementById("endDate").min = this.value || today;
        });

        const WEBHOOK_URL = "https://default87067de17bff468994aa610cdb27ba.92.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/902b52dca10540b5acdbf9064bd60add/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=WB9rPhXmCWTq6SM-qiAjv-0AwTu-Vo1wVoWjdLii-Wk";

        document.getElementById("calloutForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const btn = document.getElementById("submitBtn");
            const msg = document.getElementById("successMsg");

            btn.disabled = true;
            btn.textContent = "Submitting...";
            msg.className = "";
            msg.textContent = "";
            

            const payload = {
                name: document.getElementById("name").value,
                startDate: document.getElementById("startDate").value,
                endDate: document.getElementById("endDate").value,
                reason: document.getElementById("reason").value,
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                msg.className = "success";
                msg.textContent = "Request submitted successfully!";
                this.reset();
            } catch (err) {
                msg.className = "error";
                msg.textContent = "Failed to submit. Please try again.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Submit Request";
            }
        });
    </script>
</body>
</html>
